name: Fork candidate validation
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-check
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/fork'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Tests and workflow policy
        run: |
          node --test tests/
          node fork/lib/workflow-policy.mjs --draft .github/workflows/fork-check.yml .github/workflows/fork-release.yml
      - name: Discover stable candidate
        id: discover
        run: node fork/lib/ci.mjs discover
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.discover.outputs.build == 'true'
        with:
          repository: openai/codex
          ref: ${{ steps.discover.outputs.commit }}
          path: .work/upstream
          persist-credentials: false
      - name: Install pinned Rust toolchain
        if: steps.discover.outputs.build == 'true'
        run: rustup toolchain install "$(node --input-type=module -e 'import {readManifest} from "./fork/lib/manifest.mjs"; console.log(readManifest("./fork/manifest.json").toolchain)')" --profile minimal
      - name: Build, finalize, rebuild and package exact candidate
        if: steps.discover.outputs.build == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.discover.outputs.tag }}
          UPSTREAM_COMMIT: ${{ steps.discover.outputs.commit }}
          P85_NATIVE_ASSETS: ${{ vars.P85_NATIVE_ASSETS }}
        run: node fork/lib/ci.mjs candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.discover.outputs.build == 'true'
        with:
          name: fork-candidate
          path: .work/output/*
          if-no-files-found: error
          retention-days: 30
      - name: Candidate handoff
        if: steps.discover.outputs.build == 'true'
        run: echo 'Validated candidate artifacts are ready. The owner submits through the exact-commit guard adapter; this workflow cannot write branches or PRs.'
